services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coverline
      POSTGRES_PASSWORD: coverline
      POSTGRES_DB: coverline
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverline"]
      interval: 2s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://coverline:coverline@db:5432/coverline
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
